<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="840" viewBox="0 0 600 840" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052952" />
      <stop offset="60%" stop-color="#031b36" />
      <stop offset="100%" stop-color="#021226" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background White Page -->
  <rect width="600" height="840" fill="#F8FAFC" />

  <!-- Avatar Circle -->
  <circle cx="300" cy="80" r="44" fill="#FFA07A" filter="url(#shadow)" />
  <text x="300" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="bold" fill="#1E293B" text-anchor="middle">MH</text>

  <!-- Name and Verified Badge -->
  <g transform="translate(300, 160)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#0F172A" text-anchor="middle">Md. Robiul Hussain</text>
    <!-- Verified Badge (blue circle with checkmark) -->
    <g transform="translate(140, -18)">
      <circle cx="12" cy="12" r="12" fill="#00BAF2" />
      <path d="M7 12l3.5 3.5 7-7" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Main Dark Blue Payment Card -->
  <g filter="url(#shadow)">
    <rect x="50" y="195" width="500" height="520" rx="24" fill="url(#cardGrad)" />

    <!-- Card Top Header: Paytm + Heart + UPI -->
    <g transform="translate(180, 245)">
      <!-- "paytm" in cyan -->
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#00BAF2" letter-spacing="-1">paytm</text>
      <!-- Heart icon in red -->
      <path d="M102 -10 C96 -20 82 -14 82 -2 C82 10 102 22 102 22 C102 22 122 10 122 -2 C122 -14 108 -20 102 -10 Z" fill="#EF4444" transform="scale(0.8) translate(30, -5)" />
      <!-- "UPI" in white with flag stripes on I -->
      <text x="145" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF">UPI</text>
    </g>

    <!-- White QR Code Box -->
    <rect x="135" y="275" width="330" height="330" rx="16" fill="#FFFFFF" />
    
    <!-- QR Code SVG injected -->
    <svg x="150" y="290" width="300" height="300" viewBox="0 0 35 35">
      <path fill="#FFFFFF" d="M0 0h35v35H0z"/><path stroke="#000000" d="M1 1.5h7m5 0h2m5 0h1m3 0h1m2 0h7M1 2.5h1m5 0h1m6 0h4m1 0h1m2 0h2m3 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m1 0h4m8 0h2m4 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h1m1 0h2m1 0h1m5 0h2m1 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m1 0h1m1 0h3m1 0h3m1 0h3m2 0h1m2 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m1 0h2m1 0h6m1 0h1m1 0h1m1 0h1m3 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M9 8.5h1m1 0h3m2 0h1m2 0h2m1 0h1M1 9.5h1m1 0h5m2 0h6m1 0h3m1 0h1m1 0h1m3 0h5M1 10.5h1m1 0h1m7 0h1m1 0h1m1 0h1m1 0h2m1 0h3m1 0h2m1 0h1m3 0h1M1 11.5h1m2 0h2m1 0h1m1 0h2m1 0h3m1 0h2m1 0h1m1 0h3m4 0h1m2 0h2M1 12.5h6m1 0h6m2 0h2m2 0h1m1 0h2m1 0h1m2 0h1m1 0h3M1 13.5h1m5 0h3m1 0h1m1 0h1m2 0h1m1 0h1m2 0h1m4 0h1m2 0h1m2 0h2M2 14.5h2m1 0h2m1 0h1m2 0h3m2 0h2m1 0h3m1 0h2m1 0h1m1 0h1m1 0h1m1 0h2M7 15.5h2m2 0h1m2 0h1m1 0h2m1 0h1m1 0h1m1 0h1m4 0h5M3 16.5h4m4 0h7m2 0h1m1 0h2m1 0h2m1 0h1m1 0h3M1 17.5h2m2 0h3m4 0h1m8 0h1m1 0h4m2 0h1m2 0h1M6 18.5h1m1 0h2m4 0h2m1 0h8m1 0h2m4 0h2M3 19.5h2m2 0h3m1 0h1m4 0h3m2 0h1m3 0h1m3 0h3M2 20.5h5m1 0h4m2 0h3m2 0h1m1 0h2m2 0h1m1 0h1m1 0h1m1 0h1m1 0h1M1 21.5h3m1 0h3m2 0h2m1 0h2m2 0h3m1 0h1m3 0h2m2 0h2m1 0h2M1 22.5h5m4 0h2m2 0h1m4 0h6m2 0h2m1 0h4M1 23.5h1m1 0h2m2 0h2m1 0h3m1 0h1m1 0h2m1 0h1m1 0h3m1 0h1m1 0h1m3 0h2M1 24.5h1m1 0h2m1 0h1m2 0h3m2 0h1m1 0h2m1 0h1m1 0h2m1 0h3m4 0h1m1 0h1M1 25.5h1m1 0h1m1 0h7m4 0h3m4 0h1m1 0h5m2 0h2M9 26.5h1m1 0h2m4 0h1m2 0h3m1 0h2m3 0h1m3 0h1M1 27.5h7m2 0h2m4 0h1m1 0h1m3 0h1m1 0h2m1 0h1m1 0h1m2 0h1M1 28.5h1m5 0h1m1 0h2m1 0h1m2 0h3m1 0h4m1 0h2m3 0h1m1 0h1M1 29.5h1m1 0h3m1 0h1m1 0h1m2 0h2m1 0h4m1 0h4m1 0h5M1 30.5h1m1 0h3m1 0h1m1 0h1m2 0h1m4 0h1m1 0h4m1 0h1m3 0h3m1 0h2M1 31.5h1m1 0h3m1 0h1m1 0h2m1 0h2m2 0h2m1 0h1m2 0h3m1 0h3M1 32.5h1m5 0h1m2 0h1m2 0h2m4 0h1m2 0h2m2 0h2m1 0h1m1 0h1M1 33.5h7m1 0h1m1 0h3m2 0h3m1 0h1m2 0h5m1 0h1m2 0h1"/>
    </svg>

    <!-- UPI ID line below QR inside the card -->
    <g transform="translate(300, 650)">
      <!-- Paytm Arrowhead Icon -->
      <path d="M-140 -6 L-122 -14 L-127 -6 L-122 2 Z" fill="#00BAF2" />
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">notenest01@ptyes</text>
    </g>
  </g>

  <!-- Card Footer: Scan with any UPI app -->
  <g transform="translate(300, 755)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748B" text-anchor="middle">Scan with any UPI app</text>
  </g>

  <!-- App badges: Paytm, PhonePe, Google Pay, BHIM -->
  <g transform="translate(130, 775)">
    <!-- Paytm badge -->
    <rect x="0" y="0" width="75" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="37" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#00BAF2" text-anchor="middle">paytm</text>

    <!-- PhonePe badge -->
    <rect x="90" y="0" width="75" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="127" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#5F259F" text-anchor="middle">PhonePe</text>

    <!-- GPay badge -->
    <rect x="180" y="0" width="75" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="217" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#4285F4" text-anchor="middle">GPay</text>

    <!-- BHIM badge -->
    <rect x="270" y="0" width="75" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="307" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#00833F" text-anchor="middle">BHIM</text>
  </g>
</svg>